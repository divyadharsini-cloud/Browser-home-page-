
---
- name: Enforce Chrome and Firefox Policies on Linux
  hosts: old, new
  become: true
  gather_facts: false

  vars:
    homepage_url: "https://eyenotesweb.aravind.org/"

  tasks:
    # ---------------- CHROME ----------------

    - name: Ensure Chrome managed policy directory exists
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check existing Chrome policy file
      ansible.builtin.stat:
        path: /etc/opt/chrome/policies/managed/aravind-policies.json
      register: chrome_policy_stat

    - name: Back up existing Chrome policy file
      ansible.builtin.copy:
        src: /etc/opt/chrome/policies/managed/aravind-policies.json
        dest: /etc/opt/chrome/policies/managed/aravind-policies.json.bak
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: chrome_policy_stat.stat.exists

    - name: Deploy Chrome policies
      ansible.builtin.copy:
        dest: /etc/opt/chrome/policies/managed/aravind-policies.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "HomepageLocation": "{{ homepage_url }}",
            "HomepageIsNewTabPage": false,
            "ShowHomeButton": true,
            "RestoreOnStartup": 4,
            "RestoreOnStartupURLs": [
              "{{ homepage_url }}"
            ],
            "PasswordManagerEnabled": false,
            "ClearBrowsingDataOnExitList": [
              "cached_images_and_files"
            ]
          }

    - name: Validate Chrome policy JSON
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - /etc/opt/chrome/policies/managed/aravind-policies.json
      changed_when: false

    - name: Check Chrome Stable package status
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - '-f=${Status}'
          - google-chrome-stable
      register: chrome_package_status
      changed_when: false
      failed_when: false

    - name: Hold Chrome Stable against APT upgrades
      ansible.builtin.dpkg_selections:
        name: google-chrome-stable
        selection: hold
      when: "'install ok installed' in chrome_package_status.stdout"

    # ---------------- FIREFOX ----------------

    - name: Ensure Firefox policy directory exists
      ansible.builtin.file:
        path: /etc/firefox/policies
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check existing Firefox policy file
      ansible.builtin.stat:
        path: /etc/firefox/policies/policies.json
      register: firefox_policy_stat

    - name: Back up existing Firefox policy file
      ansible.builtin.copy:
        src: /etc/firefox/policies/policies.json
        dest: /etc/firefox/policies/policies.json.bak
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: firefox_policy_stat.stat.exists

    - name: Deploy Firefox policies
      ansible.builtin.copy:
        dest: /etc/firefox/policies/policies.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "policies": {
              "Homepage": {
                "URL": "{{ homepage_url }}",
                "Locked": true,
                "StartPage": "homepage-locked"
              },
              "PasswordManagerEnabled": false,
              "ClearOnShutdown": {
                "Cache": true
              }
            }
          }

    - name: Validate Firefox policy JSON
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - /etc/firefox/policies/policies.json
      changed_when: false

    - name: Report browser policy deployment
      ansible.builtin.debug:
        msg: >-
          Chrome and Firefox policy files have been deployed.
          Verify Chrome at chrome://policy and Firefox at about:policies.
