---
- name: Enforce Chrome Policies and Control Updates
  hosts: old, new
  become: yes
  gather_facts: no

  tasks:

    - name: Ensure Chrome managed policy directory exists
      ansible.builtin.file:
        path: /etc/opt/chrome/policies/managed
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check existing Chrome policy file
      ansible.builtin.stat:
        path: /etc/opt/chrome/policies/managed/aravind-policies.json
      register: chrome_policy_file

    - name: Back up existing Chrome policy file
      ansible.builtin.copy:
        src: /etc/opt/chrome/policies/managed/aravind-policies.json
        dest: /etc/opt/chrome/policies/managed/aravind-policies.json.bak
        remote_src: yes
        owner: root
        group: root
        mode: '0644'
      when: chrome_policy_file.stat.exists

    - name: Deploy Chrome Enterprise policies
      ansible.builtin.copy:
        dest: /etc/opt/chrome/policies/managed/aravind-policies.json
        owner: root
        group: root
        mode: '0644'
        content: |
          {
            "HomepageLocation": "https://eyenotes.aravind.org/eyenotes",
            "HomepageIsNewTabPage": false,
            "ShowHomeButton": true,
            "RestoreOnStartup": 4,
            "RestoreOnStartupURLs": [
              "https://eyenotes.aravind.org/eyenotes"
            ],
            "PasswordManagerEnabled": false,
            "ClearBrowsingDataOnExitList": [
              "cached_images_and_files"
            ]
          }

    - name: Validate Chrome policy JSON
      ansible.builtin.command:
        argv:
          - python3
          - -m
          - json.tool
          - /etc/opt/chrome/policies/managed/aravind-policies.json
      changed_when: false

    - name: Check Chrome Stable installation status
      ansible.builtin.command:
        argv:
          - dpkg-query
          - -W
          - '-f=${Status}'
          - google-chrome-stable
      register: chrome_package_status
      changed_when: false
      failed_when: false

    - name: Hold Chrome Stable against APT upgrades
      ansible.builtin.dpkg_selections:
        name: google-chrome-stable
        selection: hold
      when: "'install ok installed' in chrome_package_status.stdout"

    - name: Report deployment status
      ansible.builtin.debug:
        msg: >-
          Chrome policies deployed. EyeNotes is configured as the homepage
          and startup page. Password saving is disabled, cache clearing on
          exit is enabled, and Chrome Stable is held against APT upgrades
          if installed.

