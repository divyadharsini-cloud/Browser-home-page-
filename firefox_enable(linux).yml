
---
- name: Enable Firefox launcher on Linux
  hosts: DTHNVCGFCON0106
  become: true
  gather_facts: false
  serial: 10

  tasks:
    - name: Restore original Firefox launchers
      ansible.builtin.shell: |
        set -eu
        found=0

        for backup in /usr/bin/firefox.awx-disabled /opt/firefox*/firefox/firefox.awx-disabled; do
          [ -e "$backup" ] || [ -L "$backup" ] || continue
          original="${backup%.awx-disabled}"

          rm -f -- "$original"
          mv -- "$backup" "$original"
          found=1
        done

        if [ "$found" -eq 0 ]; then
          echo "No disabled Firefox launcher backup found."
          exit 1
        fi
      args:
        executable: /bin/bash
      register: firefox_enable
      changed_when: firefox_enable.rc == 0
