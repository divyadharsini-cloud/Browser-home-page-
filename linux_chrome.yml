
---
- name: Deploy Chrome 154.0.8037.57 on Linux client
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    required_chrome_version: "154.0.8037.57"

    chrome_zip_url: "http://172.17.9.58/chrome/linux/154.0.8037.57/chrome-linux64.zip"
    chrome_zip_path: "/var/cache/chrome-linux64.zip"

    chrome_install_dir: "/opt/chrome-for-testing/154.0.8037.57"
    chrome_binary: "/opt/chrome-for-testing/154.0.8037.57/chrome-linux64/chrome"
    chrome_link: "/usr/bin/google-chrome"

    bookmark_backup_root: "/var/backups/chrome-bookmarks"

    pending_script: "/usr/local/sbin/chrome-testing-pending.sh"
    pending_service: "chrome-testing-pending.service"
    pending_timer: "chrome-testing-pending.timer"

  tasks:

    # 1. Check client architecture
    - name: Verify client architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture == "x86_64"
        fail_msg: "This deployment requires an x86_64 Linux client."

    # 2. Detect the requested version
    - name: Detect installed Chrome for Testing version
      ansible.builtin.shell: |
        if [ -x "{{ chrome_binary }}" ]; then
          "{{ chrome_binary }}" --version 2>/dev/null |
            grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
        else
          echo NOT_INSTALLED
        fi
      args:
        executable: /bin/bash
      register: chrome_version_check
      changed_when: false

    - name: Determine installation action
      ansible.builtin.set_fact:
        chrome_action: >-
          {{
            'INSTALL'
            if (chrome_version_check.stdout | trim) == 'NOT_INSTALLED'
            else
            (
              'UPGRADE'
              if (chrome_version_check.stdout | trim)
                 is version(required_chrome_version, '<')
              else 'SKIP'
            )
          }}

    - name: Display deployment decision
      ansible.builtin.debug:
        msg:
          - "Installed version: {{ chrome_version_check.stdout | trim }}"
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"

    # 3. Back up bookmarks without scanning thinclient_drives
    - name: Create bookmark backup directory
      ansible.builtin.file:
        path: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Find Chrome bookmarks
      ansible.builtin.shell: |
        find /home /root \
          -path '*/thinclient_drives' -prune -o \
          -type f -name Bookmarks -print 2>/dev/null || true
      args:
        executable: /bin/bash
      register: bookmark_search
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Back up Chrome bookmarks
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}/{{ item | regex_replace('^/', '') | replace('/', '__') }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ bookmark_search.stdout_lines | default([]) }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Display bookmark backup result
      ansible.builtin.debug:
        msg: "Bookmark files backed up: {{ bookmark_search.stdout_lines | default([]) | length }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 4. Install dependencies on the CLIENT only
    - name: Install Chrome runtime dependencies
      ansible.builtin.shell: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive
        apt-get update

        choose_pkg() {
          for pkg in "$@"; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              echo "$pkg"
              return 0
            fi
          done
          echo "Required package unavailable: $*" >&2
          return 1
        }

        pkgs=(
          unzip libnss3 libx11-6 libx11-xcb1 libxcb1
          libxcomposite1 libxdamage1 libxext6 libxfixes3
          libxrandr2 libgbm1 libpango-1.0-0 libcairo2
          libxshmfence1 libdrm2 libxkbcommon0
        )

        pkgs+=("$(choose_pkg libatk1.0-0t64 libatk1.0-0)")
        pkgs+=("$(choose_pkg libatk-bridge2.0-0t64 libatk-bridge2.0-0)")
        pkgs+=("$(choose_pkg libatspi2.0-0t64 libatspi2.0-0)")
        pkgs+=("$(choose_pkg libasound2t64 libasound2)")
        pkgs+=("$(choose_pkg libgtk-3-0t64 libgtk-3-0)")

        apt-get install -y "${pkgs[@]}"
      args:
        executable: /bin/bash
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 5. Download the exact ZIP to the CLIENT
    - name: Create client package cache directory
      ansible.builtin.file:
        path: /var/cache
        state: directory
        mode: "0755"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Download Chrome ZIP from internal mirror
      ansible.builtin.get_url:
        url: "{{ chrome_zip_url }}"
        dest: "{{ chrome_zip_path }}"
        mode: "0644"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 6. Confirm the ZIP is valid before proceeding
    - name: Test downloaded ZIP archive
      ansible.builtin.command:
        argv:
          - unzip
          - -tq
          - "{{ chrome_zip_path }}"
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 7. Never terminate a running browser
    - name: Check whether Chrome is running
      ansible.builtin.shell: |
        pgrep -x chrome >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      failed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 8. Install immediately if Chrome is closed
    - name: Create Chrome installation directory
      ansible.builtin.file:
        path: "{{ chrome_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    - name: Extract Chrome ZIP
      ansible.builtin.unarchive:
        src: "{{ chrome_zip_path }}"
        dest: "{{ chrome_install_dir }}"
        remote_src: true
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    - name: Verify exact Chrome version
      ansible.builtin.command:
        argv:
          - "{{ chrome_binary }}"
          - --version
      register: chrome_verified
      changed_when: false
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    - name: Assert exact required version
      ansible.builtin.assert:
        that:
          - >-
            (chrome_verified.stdout |
            regex_search('[0-9]+(\.[0-9]+){3}')) ==
            required_chrome_version
        fail_msg: "Unexpected browser version: {{ chrome_verified.stdout }}"
        success_msg: "Verified {{ chrome_verified.stdout }}"
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    # 9. Configure the launcher only after successful installation
    - name: Configure google-chrome command
      ansible.builtin.file:
        src: "{{ chrome_binary }}"
        dest: "{{ chrome_link }}"
        state: link
        force: true
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and chrome_running.rc != 0
        )

    - name: Create Chrome application launcher
      ansible.builtin.copy:
        dest: /usr/share/applications/google-chrome-stable.desktop
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupNotify=true
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and chrome_running.rc != 0
        )

    # 10. Defer deployment while Chrome is running
    - name: Create deferred deployment script
      ansible.builtin.copy:
        dest: "{{ pending_script }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail

          REQUIRED="{{ required_chrome_version }}"
          ZIP="{{ chrome_zip_path }}"
          DIR="{{ chrome_install_dir }}"
          BIN="{{ chrome_binary }}"
          TIMER="{{ pending_timer }}"

          # Do not kill Chrome or close tabs.
          if pgrep -x chrome >/dev/null 2>&1; then
            exit 0
          fi

          mkdir -p "$DIR"
          unzip -oq "$ZIP" -d "$DIR"

          VERSION=$(
            "$BIN" --version |
            grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
          )

          if [ "$VERSION" != "$REQUIRED" ]; then
            echo "Expected $REQUIRED; found $VERSION" >&2
            exit 1
          fi

          ln -sfn "$BIN" /usr/bin/google-chrome

          cat > /usr/share/applications/google-chrome-stable.desktop <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupNotify=true
          DESKTOP

          systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
          echo "Installed Chrome $VERSION"

      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Create deferred deployment service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_service }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Deploy Chrome after browser closure

          [Service]
          Type=oneshot
          ExecStart={{ pending_script }}
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Create deferred deployment timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_timer }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Retry Chrome deployment

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit={{ pending_service }}

          [Install]
          WantedBy=timers.target
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Enable deferred deployment timer
      ansible.builtin.systemd:
        name: "{{ pending_timer }}"
        daemon_reload: true
        enabled: true
        state: started
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    # 11. Final result
    - name: Display final deployment status
      ansible.builtin.debug:
        msg:
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"
          - >-
            {{
              'Chrome is running. Deployment will retry after it closes.'
              if chrome_action in ['INSTALL', 'UPGRADE']
                 and chrome_running.rc == 0
              else
              (
                chrome_verified.stdout
                if chrome_verified is defined
                else 'Requested version already exists.'
              )
            }}
