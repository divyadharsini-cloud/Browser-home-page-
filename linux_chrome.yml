
---
- name: Install or Upgrade Google Chrome on Linux
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    target_version: "154.0.8037.57"
    chrome_deb_url: "http://172.17.9.58/chrome/linux/google-chrome-stable_154.0.8037.57-1_amd64.deb"
    chrome_deb_path: "/tmp/google-chrome-stable.deb"

  tasks:
    - name: Verify supported Linux architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: "This playbook currently supports x86_64 Linux only."

    - name: Detect installed Google Chrome
      ansible.builtin.shell: |
        set -o pipefail
        if dpkg-query -W -f='${Status}' google-chrome-stable 2>/dev/null \
             | grep -q 'install ok installed'; then
          dpkg-query -W -f='${Version}' google-chrome-stable
        elif command -v google-chrome >/dev/null 2>&1; then
          google-chrome --version \
            | grep -oE '[0-9]+(\.[0-9]+){3}' | head -1
        else
          echo "NOT_INSTALLED"
        fi
      args:
        executable: /bin/bash
      register: chrome_detect
      changed_when: false

    - name: Display detected Chrome version
      ansible.builtin.debug:
        msg: "Detected Chrome: {{ chrome_detect.stdout | trim }}"

    - name: Determine required action
      ansible.builtin.set_fact:
        chrome_action: >-
          {% set v = chrome_detect.stdout | trim %}
          {% if v == 'NOT_INSTALLED' %}
          INSTALL
          {% else %}
          {% set v = v | regex_replace('-[^-]+$', '') %}
          {% if v is version(target_version, '<', version_type='semver') %}
          UPGRADE
          {% else %}
          SKIP
          {% endif %}
          {% endif %}

    - name: Check whether Chrome is running
      ansible.builtin.shell: |
        pgrep -f '(^|/)(google-chrome|chrome)( |$)' >/dev/null
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      failed_when: false
      when: chrome_action | trim in ['INSTALL', 'UPGRADE']

    - name: Display action
      ansible.builtin.debug:
        msg: >-
          {% if chrome_action | trim == 'SKIP' %}
          Chrome is already at target version or newer. Skipping.
          {% elif chrome_running.rc | default(1) == 0 %}
          Chrome is running. Skipping safely; rerun after it is closed.
          {% else %}
          Chrome action: {{ chrome_action | trim }}
          {% endif %}

    - name: Download Chrome package from internal mirror
      ansible.builtin.get_url:
        url: "{{ chrome_deb_url }}"
        dest: "{{ chrome_deb_path }}"
        mode: "0644"
        force: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify downloaded Debian package
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - --info
          - "{{ chrome_deb_path }}"
      register: deb_check
      changed_when: false
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Install or upgrade Google Chrome
      ansible.builtin.apt:
        deb: "{{ chrome_deb_path }}"
        state: present
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify installed Chrome version
      ansible.builtin.command:
        argv:
          - google-chrome
          - --version
      register: chrome_final
      changed_when: false
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Display final status
      ansible.builtin.debug:
        msg: >-
          {% if chrome_action | trim == 'SKIP' %}
          SKIPPED: Chrome is already at target version or newer.
          {% elif chrome_running.rc | default(1) == 0 %}
          SKIPPED: Chrome is running. Close it and rerun this job.
          {% else %}
          SUCCESS: {{ chrome_final.stdout }}
          {% endif %}
