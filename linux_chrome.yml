
---
- name: Install or Upgrade Chrome for Testing on Linux
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    target_version: "154.0.8037.57"
    chrome_zip_url: "http://172.17.9.58/chrome/linux/154.0.8037.57/chrome-linux64.zip"
    zip_path: "/tmp/chrome-linux64.zip"
    install_root: "/opt/google/chrome-for-testing"
    target_dir: "/opt/google/chrome-for-testing/154.0.8037.57"
    current_link: "/opt/google/chrome-for-testing/current"
    staging_dir: "/opt/google/chrome-for-testing/staging"
    launcher_path: "/usr/local/bin/google-chrome-for-testing"

  tasks:
    - name: Verify supported architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: "This playbook supports x86_64 Linux only."

    - name: Ensure unzip is installed
      ansible.builtin.package:
        name: unzip
        state: present

    - name: Detect installed Chrome for Testing
      ansible.builtin.shell: |
        if [ -x "{{ current_link }}/chrome" ]; then
          "{{ current_link }}/chrome" --version |
            grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
        else
          echo "NOT_INSTALLED"
        fi
      args:
        executable: /bin/bash
      register: detected_chrome
      changed_when: false

    - name: Set installed version
      ansible.builtin.set_fact:
        installed_version: "{{ detected_chrome.stdout | trim }}"

    - name: Compare installed and target versions
      ansible.builtin.command:
        argv:
          - dpkg
          - --compare-versions
          - "{{ installed_version }}"
          - lt
          - "{{ target_version }}"
      register: version_check
      changed_when: false
      failed_when: false
      when: installed_version != "NOT_INSTALLED"

    - name: Decide installation action
      ansible.builtin.set_fact:
        chrome_action: >-
          {% if installed_version == 'NOT_INSTALLED' %}
          INSTALL
          {% elif version_check.rc == 0 %}
          UPGRADE
          {% else %}
          SKIP
          {% endif %}

    - name: Display detected version and action
      ansible.builtin.debug:
        msg:
          - "Installed version: {{ installed_version }}"
          - "Target version: {{ target_version }}"
          - "Action: {{ chrome_action | trim }}"

    - name: Check whether Chrome for Testing is running
      ansible.builtin.shell: |
        pgrep -af '^/opt/google/chrome-for-testing/[^ ]*/chrome([[:space:]]|$)' >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      failed_when: false
      when: chrome_action | trim in ['INSTALL', 'UPGRADE']

    - name: Create installation root
      ansible.builtin.file:
        path: "{{ install_root }}"
        state: directory
        mode: "0755"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Remove old staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Create staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: directory
        mode: "0755"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Download Chrome ZIP
      ansible.builtin.get_url:
        url: "{{ chrome_zip_url }}"
        dest: "{{ zip_path }}"
        mode: "0644"
        force: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Extract Chrome ZIP
      ansible.builtin.unarchive:
        src: "{{ zip_path }}"
        dest: "{{ staging_dir }}"
        remote_src: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify extracted Chrome executable
      ansible.builtin.stat:
        path: "{{ staging_dir }}/chrome-linux64/chrome"
      register: extracted_chrome
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Validate extracted Chrome executable
      ansible.builtin.assert:
        that:
          - extracted_chrome.stat.exists
          - extracted_chrome.stat.executable
        fail_msg: "Chrome executable was not found in the downloaded ZIP."
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify extracted version
      ansible.builtin.command:
        argv:
          - "{{ staging_dir }}/chrome-linux64/chrome"
          - --version
      register: extracted_version
      changed_when: false
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Ensure ZIP contains the target version
      ansible.builtin.assert:
        that:
          - (extracted_version.stdout | regex_search('[0-9]+(\.[0-9]+){3}')) == target_version
        fail_msg: "The downloaded ZIP does not contain the requested version."
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Remove old target version directory
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Move extracted Chrome into target directory
      ansible.builtin.command:
        argv:
          - mv
          - "{{ staging_dir }}/chrome-linux64"
          - "{{ target_dir }}"
      changed_when: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Update current version symlink
      ansible.builtin.file:
        src: "{{ target_dir }}"
        dest: "{{ current_link }}"
        state: link
        force: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Install Chrome for Testing launcher
      ansible.builtin.copy:
        dest: "{{ launcher_path }}"
        mode: "0755"
        content: |
          #!/bin/sh
          exec /opt/google/chrome-for-testing/current/chrome "$@"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify installed Chrome version
      ansible.builtin.command:
        argv:
          - "{{ current_link }}/chrome"
          - --version
      register: final_version
      changed_when: false
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Confirm final version
      ansible.builtin.assert:
        that:
          - (final_version.stdout | regex_search('[0-9]+(\.[0-9]+){3}')) == target_version
        fail_msg: "Installed Chrome version verification failed."
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Delete downloaded ZIP after successful verification
      ansible.builtin.file:
        path: "{{ zip_path }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Remove staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Display final result
      ansible.builtin.debug:
        msg: >-
          {% if chrome_action | trim == 'SKIP' %}
          SKIPPED: Chrome for Testing is already at the target version or newer.
          {% elif chrome_running.rc | default(1) == 0 %}
          SKIPPED: Chrome for Testing is running. Close it and rerun the AWX job.
          {% else %}
          SUCCESS: {{ final_version.stdout }}.
          ZIP removed after verification.
          {% endif %}
