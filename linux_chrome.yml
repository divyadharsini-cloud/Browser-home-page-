
---
- name: Install or Upgrade Chrome for Testing from Internal ZIP
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    target_version: "154.0.8037.57"
    mirror_zip_url: "http://172.17.9.58/chrome/linux/154.0.8037.57/chrome-linux64.zip"

    install_root: "/opt/google/chrome-for-testing"
    target_dir: "/opt/google/chrome-for-testing/154.0.8037.57"
    current_dir: "/opt/google/chrome-for-testing/current"
    staging_dir: "/opt/google/chrome-for-testing/staging"
    zip_path: "/tmp/chrome-linux64.zip"

  tasks:
    - name: Verify supported architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture == "x86_64"
        fail_msg: "This playbook supports x86_64 Linux only."

    - name: Check unzip availability
      ansible.builtin.package:
        name: unzip
        state: present

    - name: Detect installed Chrome for Testing
      ansible.builtin.shell: |
        if [ -x "{{ current_dir }}/chrome" ]; then
          "{{ current_dir }}/chrome" --version 2>/dev/null \
            | grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
        else
          echo "NOT_INSTALLED"
        fi
      args:
        executable: /bin/bash
      register: detected_chrome
      changed_when: false

    - name: Set installed version
      ansible.builtin.set_fact:
        installed_version: "{{ detected_chrome.stdout | trim }}"

    - name: Compare installed version with target
      ansible.builtin.command:
        argv:
          - dpkg
          - --compare-versions
          - "{{ installed_version }}"
          - lt
          - "{{ target_version }}"
      register: version_comparison
      changed_when: false
      failed_when: false
      when: installed_version != "NOT_INSTALLED"

    - name: Decide installation action
      ansible.builtin.set_fact:
        chrome_action: >-
          {% if installed_version == 'NOT_INSTALLED' %}
          INSTALL
          {% elif version_comparison.rc == 0 %}
          UPGRADE
          {% else %}
          SKIP
          {% endif %}

    - name: Display detected version and action
      ansible.builtin.debug:
        msg:
          - "Installed version: {{ installed_version }}"
          - "Target version: {{ target_version }}"
          - "Action: {{ chrome_action | trim }}"

    - name: Check whether Chrome for Testing is running
      ansible.builtin.shell: |
        pgrep -f '^/opt/google/chrome-for-testing/[^ ]*/chrome([[:space:]]|$)' >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      failed_when: false
      when: chrome_action | trim in ['INSTALL', 'UPGRADE']

    - name: Create installation root
      ansible.builtin.file:
        path: "{{ install_root }}"
        state: directory
        mode: "0755"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Remove incomplete staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Create staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: directory
        mode: "0755"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Download Chrome ZIP from internal mirror
      ansible.builtin.get_url:
        url: "{{ mirror_zip_url }}"
        dest: "{{ zip_path }}"
        mode: "0644"
        force: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Extract Chrome ZIP
      ansible.builtin.unarchive:
        src: "{{ zip_path }}"
        dest: "{{ staging_dir }}"
        remote_src: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify extracted Chrome executable
      ansible.builtin.stat:
        path: "{{ staging_dir }}/chrome-linux64/chrome"
      register: extracted_chrome
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Stop if ZIP does not contain Chrome
      ansible.builtin.assert:
        that:
          - extracted_chrome.stat.exists
          - extracted_chrome.stat.executable
        fail_msg: "The ZIP does not contain an executable at chrome-linux64/chrome."
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify extracted Chrome version
      ansible.builtin.command:
        argv:
          - "{{ staging_dir }}/chrome-linux64/chrome"
          - --version
      register: extracted_version
      changed_when: false
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Confirm ZIP contains the requested version
      ansible.builtin.assert:
        that:
          - extracted_version.stdout | regex_search('[0-9]+(\.[0-9]+){3}') == target_version
        fail_msg: >-
          The downloaded ZIP does not contain version {{ target_version }}.
          Detected: {{ extracted_version.stdout }}
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Remove previous incomplete target directory
      ansible.builtin.file:
        path: "{{ target_dir }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Install versioned Chrome directory
      ansible.builtin.command:
        argv:
          - mv
          - "{{ staging_dir }}/chrome-linux64"
          - "{{ target_dir }}"
      changed_when: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Set Chrome executable permissions
      ansible.builtin.file:
        path: "{{ target_dir }}/chrome"
        mode: "0755"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Point current to installed Chrome version
      ansible.builtin.file:
        src: "{{ target_dir }}"
        dest: "{{ current_dir }}"
        state: link
        force: true
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Create Chrome for Testing launcher
      ansible.builtin.copy:
        dest: /usr/local/bin/google-chrome-for-testing
        content: |
          #!/bin/sh
          exec /opt/google/chrome-for-testing/current/chrome "$@"
        mode: "0755"
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Verify final Chrome version
      ansible.builtin.command:
        argv:
          - "{{ current_dir }}/chrome"
          - --version
      register: final_version
      changed_when: false
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0

    - name: Display final status
      ansible.builtin.debug:
        msg: >-
          {% if chrome_action | trim == 'SKIP' %}
          SKIPPED: Chrome for Testing is already at target version or newer.
          Installed: {{ installed_version }}
          {% elif chrome_running.rc | default(1) == 0 %}
          SKIPPED: Chrome for Testing is running. Close it and rerun the AWX job.
          {% else %}
          SUCCESS: {{ final_version.stdout }} installed.
          Launcher: /usr/local/bin/google-chrome-for-testing
          {% endif %}

    - name: Clean up staging directory
      ansible.builtin.file:
        path: "{{ staging_dir }}"
        state: absent
      when:
        - chrome_action | trim in ['INSTALL', 'UPGRADE']
        - chrome_running.rc | default(1) != 0
