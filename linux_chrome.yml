
---
- name: Install or Upgrade Google Chrome Stable on Linux
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    # ==========================================================
    # CHROME VERSION AND INTERNAL MIRROR
    # ==========================================================

    required_chrome_version: "154.0.8037.57"

    # IMPORTANT: This must point to the STANDARD STABLE .deb,
    # not the Chrome for Testing ZIP.
    chrome_deb_url: "http://172.17.9.58/chrome/google-chrome-stable_current_amd64.deb"
    chrome_deb_path: "/var/cache/google-chrome-stable.deb"

    # ==========================================================
    # CHROME PATHS
    # ==========================================================

    chrome_binary: "/usr/bin/google-chrome-stable"
    chrome_link: "/usr/bin/google-chrome"

    # ==========================================================
    # BOOKMARK BACKUP
    # ==========================================================

    bookmark_backup_root: "/var/backups/chrome-bookmarks"

    # ==========================================================
    # DEFERRED INSTALLATION / UPGRADE
    # ==========================================================

    pending_script: "/usr/local/sbin/chrome-stable-pending.sh"
    pending_service: "chrome-stable-pending.service"
    pending_timer: "chrome-stable-pending.timer"

  tasks:

    # ==========================================================
    # 1. DETECT GOOGLE CHROME STABLE
    # ==========================================================

    - name: Detect installed Google Chrome Stable version
      ansible.builtin.shell: |
        for bin in \
          /usr/bin/google-chrome-stable \
          /opt/google/chrome/google-chrome; do

          if [ -x "$bin" ]; then
            VERSION=$(
              "$bin" --version 2>/dev/null |
              grep -oE '[0-9]+(\.[0-9]+){3}' |
              head -n 1 || true
            )

            if [ -n "$VERSION" ]; then
              echo "$VERSION"
              exit 0
            fi
          fi
        done

        echo "NOT_INSTALLED"
      args:
        executable: /bin/bash
      register: chrome_version_check
      changed_when: false

    # ==========================================================
    # 2. DETERMINE INSTALL / UPGRADE / SKIP
    # ==========================================================

    - name: Determine Chrome action
      ansible.builtin.set_fact:
        chrome_action: >-
          {{
            'INSTALL'
            if (chrome_version_check.stdout | trim) == 'NOT_INSTALLED'
            else
            (
              'UPGRADE'
              if (chrome_version_check.stdout | trim)
                 is version(required_chrome_version, '<')
              else 'SKIP'
            )
          }}

    - name: Display Chrome decision
      ansible.builtin.debug:
        msg:
          - "Installed version: {{ chrome_version_check.stdout | trim }}"
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"

    # ==========================================================
    # 3. BACK UP BOOKMARKS BEFORE INSTALL / UPGRADE
    # ==========================================================

    - name: Create timestamped bookmark backup directory
      ansible.builtin.file:
        path: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Find existing Chrome bookmark files
      ansible.builtin.find:
        paths:
          - /home
          - /root
        patterns: Bookmarks
        file_type: file
        recurse: true
        hidden: true
      register: bookmark_files
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Back up Chrome bookmark files
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}/{{ item.path | regex_replace('^/', '') | replace('/', '__') }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ bookmark_files.files | default([]) }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Display bookmark backup summary
      ansible.builtin.debug:
        msg:
          - "Bookmark files found: {{ bookmark_files.matched | default(0) }}"
          - "Backup location: {{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # ==========================================================
    # 4. DOWNLOAD THE STANDARD STABLE DEB PACKAGE
    # ==========================================================

    - name: Create package cache directory
      ansible.builtin.file:
        path: /var/cache
        state: directory
        mode: "0755"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Download Google Chrome Stable package
      ansible.builtin.get_url:
        url: "{{ chrome_deb_url }}"
        dest: "{{ chrome_deb_path }}"
        mode: "0644"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # ==========================================================
    # 5. VALIDATE PACKAGE VERSION BEFORE INSTALLATION
    # ==========================================================

    - name: Read downloaded package version
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - -f
          - "{{ chrome_deb_path }}"
          - Version
      register: chrome_package_version
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Verify downloaded package version
      ansible.builtin.assert:
        that:
          - >-
            (chrome_package_version.stdout | trim |
            regex_replace('-[^-]+$', '')) == required_chrome_version
        fail_msg: >-
          Downloaded DEB version {{ chrome_package_version.stdout | default('unknown') }}
          does not match required version {{ required_chrome_version }}.
          Check the internal mirror. No installation will be performed.
        success_msg: "Downloaded Chrome Stable package version is correct."
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # ==========================================================
    # 6. CHECK WHETHER ANY CHROME BROWSER IS RUNNING
    # NEVER FORCE-CLOSE THE BROWSER
    # ==========================================================

    - name: Check Chrome processes
      ansible.builtin.shell: |
        pgrep -x chrome >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      failed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Display Chrome process status
      ansible.builtin.debug:
        msg: >-
          {{
            'Chrome is running. Installation or upgrade will be deferred.'
            if chrome_running.rc == 0
            else 'Chrome is not running. Installation or upgrade can proceed.'
          }}
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # ==========================================================
    # 7. CREATE DEFERRED INSTALLATION SCRIPT
    # ==========================================================

    - name: Create pending installation script
      ansible.builtin.copy:
        dest: "{{ pending_script }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail

          REQUIRED="{{ required_chrome_version }}"
          PACKAGE="{{ chrome_deb_path }}"
          TIMER="{{ pending_timer }}"

          # Never kill Chrome or close browser tabs.
          if pgrep -x chrome >/dev/null 2>&1; then
              echo "Chrome is running; retry after it closes."
              exit 0
          fi

          # Skip if the required version or a newer version exists.
          CURRENT=$(
            for BIN in \
              /usr/bin/google-chrome-stable \
              /opt/google/chrome/google-chrome; do
              if [ -x "$BIN" ]; then
                "$BIN" --version 2>/dev/null |
                  grep -oE '[0-9]+(\.[0-9]+){3}' |
                  head -n 1
                break
              fi
            done
          )

          if [ -n "$CURRENT" ] &&
             dpkg --compare-versions "$CURRENT" ge "$REQUIRED"; then
              systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
              exit 0
          fi

          if [ ! -s "$PACKAGE" ]; then
              echo "Chrome package is missing: $PACKAGE" >&2
              exit 1
          fi

          # Install only after Chrome is closed.
          apt-get install -y "$PACKAGE"

          INSTALLED=$(
            /usr/bin/google-chrome-stable --version 2>/dev/null |
            grep -oE '[0-9]+(\.[0-9]+){3}' |
            head -n 1
          )

          if ! dpkg --compare-versions "$INSTALLED" ge "$REQUIRED"; then
              echo "Chrome version verification failed: $INSTALLED" >&2
              exit 1
          fi

          ln -sfn /usr/bin/google-chrome-stable /usr/bin/google-chrome

          systemctl disable --now "$TIMER" >/dev/null 2>&1 || true

          echo "Chrome Stable installed/upgraded successfully: $INSTALLED"

      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    # ==========================================================
    # 8. CREATE SYSTEMD SERVICE AND TIMER FOR DEFERRED WORK
    # ==========================================================

    - name: Create pending installation service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_service }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Install or upgrade Google Chrome Stable after browser closure

          [Service]
          Type=oneshot
          ExecStart={{ pending_script }}
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Create pending installation timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_timer }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Retry Google Chrome Stable installation

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit={{ pending_service }}

          [Install]
          WantedBy=timers.target
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Enable pending installation timer
      ansible.builtin.systemd:
        name: "{{ pending_timer }}"
        daemon_reload: true
        enabled: true
        state: started
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    # ==========================================================
    # 9. INSTALL OR UPGRADE IMMEDIATELY WHEN CHROME IS CLOSED
    # ==========================================================

    - name: Install or upgrade Google Chrome Stable
      ansible.builtin.apt:
        deb: "{{ chrome_deb_path }}"
        state: present
      register: chrome_install_result
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    # ==========================================================
    # 10. REPAIR THE STANDARD CHROME COMMAND
    # ==========================================================

    - name: Configure google-chrome command
      ansible.builtin.file:
        src: "{{ chrome_binary }}"
        dest: "{{ chrome_link }}"
        state: link
        force: true
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and chrome_running.rc != 0
        )

    # ==========================================================
    # 11. CREATE APPLICATIONS MENU LAUNCHER
    # ==========================================================

    - name: Create Google Chrome desktop entry
      ansible.builtin.copy:
        dest: /usr/share/applications/google-chrome-stable.desktop
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome-stable %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupNotify=true

    - name: Refresh desktop application database
      ansible.builtin.command:
        cmd: update-desktop-database /usr/share/applications
      register: desktop_database_result
      changed_when: false
      failed_when: false

    # ==========================================================
    # 12. VERIFY IMMEDIATE INSTALLATION
    # ==========================================================

    - name: Verify Google Chrome Stable version
      ansible.builtin.command:
        cmd: "{{ chrome_binary }} --version"
      register: chrome_final_version
      changed_when: false
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and chrome_running.rc != 0
        )

    # ==========================================================
    # 13. FINAL STATUS
    # ==========================================================

    - name: Display final Chrome management status
      ansible.builtin.debug:
        msg:
          - "Detected version: {{ chrome_version_check.stdout | trim }}"
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"
          - "Bookmarks found: {{ bookmark_files.matched | default(0) }}"
          - >-
            {{
              'Chrome is running. Installation/upgrade is scheduled for after it closes.'
              if chrome_action in ['INSTALL', 'UPGRADE']
                 and chrome_running.rc == 0
              else
              (
                'Chrome management completed: ' ~ chrome_final_version.stdout
                if chrome_action in ['INSTALL', 'UPGRADE', 'SKIP']
                else 'No action required.'
              )
            }}
