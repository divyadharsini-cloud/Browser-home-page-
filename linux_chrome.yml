
---
- name: Install or Upgrade Chrome for Testing on Linux
  hosts: ansibletesting
  become: yes
  gather_facts: true

  vars:
    # ============================================================
    # VERSION AND INTERNAL MIRROR
    # ============================================================

    required_chrome_version: "154.0.8037.57"

    chrome_url: "http://172.17.9.58/chrome/linux/154.0.8037.57/chrome-linux64.zip"
    chrome_archive: "/var/cache/chrome-linux64.zip"

    # ============================================================
    # INSTALLATION PATHS
    # ============================================================

    chrome_parent_dir: "/opt/google/chrome-for-testing"
    chrome_install_dir: "/opt/google/chrome-for-testing/{{ required_chrome_version }}"
    chrome_binary: "/opt/google/chrome-for-testing/{{ required_chrome_version }}/chrome"

    chrome_link: "/usr/bin/google-chrome"

    chrome_desktop_dir: "/usr/local/share/applications"
    chrome_desktop_file: "/usr/local/share/applications/com.google.Chrome.desktop"

    # ============================================================
    # BOOKMARK BACKUP
    # ============================================================

    chrome_bookmark_backup_root: "/var/backups/chrome-bookmarks"

    # ============================================================
    # DEFERRED INSTALLATION
    # ============================================================

    chrome_script: "/usr/local/sbin/chrome-pending-upgrade.sh"
    chrome_service: "chrome-pending-upgrade.service"
    chrome_timer: "chrome-pending-upgrade.timer"

  tasks:

    # ============================================================
    # 1. INSTALL REQUIRED UTILITY
    # ============================================================

    - name: Install unzip
      ansible.builtin.apt:
        name: unzip
        state: present
        update_cache: yes
        cache_valid_time: 3600

    # ============================================================
    # 2. DETECT EXISTING CHROME VERSION
    # ============================================================

    - name: Detect installed Chrome version
      ansible.builtin.shell: |
        set -o pipefail

        for BIN in \
          "{{ chrome_binary }}" \
          "/opt/chrome-for-testing/chrome" \
          "/opt/google/chrome-for-testing/154.0.8037.57/chrome" \
          "/opt/google/chrome/chrome" \
          "/usr/bin/google-chrome-stable" \
          "/usr/bin/google-chrome"; do

          if [ -x "$BIN" ]; then
            VERSION=$("$BIN" --version 2>/dev/null |
              grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1 || true)

            if [ -n "$VERSION" ]; then
              echo "$VERSION"
              exit 0
            fi
          fi
        done

        exit 0
      args:
        executable: /bin/bash
      register: chrome_version_result
      changed_when: false

    - name: Display Chrome version information
      ansible.builtin.debug:
        msg:
          - "Installed Chrome version: {{ chrome_version_result.stdout | trim | default('Not Installed', true) }}"
          - "Required Chrome version: {{ required_chrome_version }}"

    # ============================================================
    # 3. DETERMINE INSTALL / UPGRADE / SKIP / NEWER
    # ============================================================

    - name: Determine Chrome action
      ansible.builtin.set_fact:
        chrome_action: >-
          {{
            'INSTALL'
            if (chrome_version_result.stdout | trim | length == 0)
            else
            (
              'UPGRADE'
              if (chrome_version_result.stdout | trim)
                 is version(required_chrome_version, '<')
              else
              (
                'SKIP'
                if (chrome_version_result.stdout | trim)
                   is version(required_chrome_version, '==')
                else 'NEWER'
              )
            )
          }}

    - name: Display Chrome action
      ansible.builtin.debug:
        msg: "Chrome action: {{ chrome_action }}"

    # ============================================================
    # 4. CREATE TIMESTAMPED BOOKMARK BACKUP DIRECTORY
    # BACKUP RUNS ON EVERY PLAYBOOK EXECUTION
    # ============================================================

    - name: Create bookmark backup directory
      ansible.builtin.file:
        path: >-
          {{ chrome_bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}
        state: directory
        owner: root
        group: root
        mode: '0700'

    # ============================================================
    # 5. FIND BOOKMARK FILES IN USER PROFILES
    # ============================================================

    - name: Find Chrome bookmark files
      ansible.builtin.find:
        paths: /home
        patterns: Bookmarks
        file_type: file
        recurse: true
        hidden: true
      register: chrome_bookmark_files

    # ============================================================
    # 6. BACK UP BOOKMARK FILES
    # ============================================================

    - name: Back up Chrome bookmarks
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: >-
          {{ chrome_bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}/{{ item.path | regex_replace('^/home/', '') | replace('/', '__') }}
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      loop: "{{ chrome_bookmark_files.files | default([]) }}"

    - name: Display bookmark backup summary
      ansible.builtin.debug:
        msg:
          - "Bookmark files found: {{ chrome_bookmark_files.matched | default(0) }}"
          - "Backup location: {{ chrome_bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"

    # ============================================================
    # 7. DOWNLOAD CHROME ONLY IF REQUIRED
    # ============================================================

    - name: Create Chrome cache directory
      ansible.builtin.file:
        path: /var/cache
        state: directory
        mode: '0755'
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Download Chrome for Testing ZIP
      ansible.builtin.get_url:
        url: "{{ chrome_url }}"
        dest: "{{ chrome_archive }}"
        mode: '0644'
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # ============================================================
    # 8. CHECK RUNNING CHROME PROCESSES
    # NEVER FORCE-CLOSE CHROME
    # ============================================================

    - name: Check whether Chrome is running
      ansible.builtin.shell: |
        pgrep -x chrome >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: chrome_running
      failed_when: false
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Display Chrome running status
      ansible.builtin.debug:
        msg: >-
          {{
            'Chrome is running. Installation will wait until the browser closes.'
            if chrome_running.rc | default(1) == 0
            else 'Chrome is not running. Installation can proceed.'
          }}
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # ============================================================
    # 9. CREATE INSTALLATION SCRIPT
    # ============================================================

    - name: Create Chrome installation script
      ansible.builtin.copy:
        dest: "{{ chrome_script }}"
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          set -euo pipefail

          REQUIRED="{{ required_chrome_version }}"
          ARCHIVE="{{ chrome_archive }}"
          TARGET="{{ chrome_install_dir }}"
          TARGET_BINARY="{{ chrome_binary }}"
          LINK="{{ chrome_link }}"
          TIMER="{{ chrome_timer }}"
          DESKTOP_DIR="{{ chrome_desktop_dir }}"
          BACKUP="${TARGET}.previous.$(date +%s)"

          # Do not terminate Chrome or any user browser session.
          if pgrep -x chrome >/dev/null 2>&1; then
              echo "Chrome is running. Installation postponed."
              exit 0
          fi

          # Skip reinstall when the managed version is already correct.
          if [ -x "$TARGET_BINARY" ]; then
              CURRENT=$("$TARGET_BINARY" --version |
                  grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1 || true)

              if [ "$CURRENT" = "$REQUIRED" ]; then
                  ln -sfn "$TARGET_BINARY" "$LINK"

                  mkdir -p "$DESKTOP_DIR"

                  cat > "$DESKTOP_DIR/com.google.Chrome.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          EOF

                  systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
                  echo "Required Chrome version already installed."
                  exit 0
              fi
          fi

          # Validate the archive before changing existing files.
          if [ ! -s "$ARCHIVE" ]; then
              echo "Chrome archive missing: $ARCHIVE" >&2
              exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"

          STAGE=$(mktemp -d "$(dirname "$TARGET")/.chrome-stage.XXXXXX")

          cleanup() {
              rm -rf "$STAGE"
          }
          trap cleanup EXIT

          # Extract into a staging directory.
          unzip -q "$ARCHIVE" -d "$STAGE"

          NEW_BINARY="$STAGE/chrome-linux64/chrome"

          if [ ! -x "$NEW_BINARY" ]; then
              echo "Expected chrome-linux64/chrome was not found." >&2
              exit 1
          fi

          NEW_VERSION=$("$NEW_BINARY" --version |
              grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1 || true)

          if [ "$NEW_VERSION" != "$REQUIRED" ]; then
              echo "Version mismatch: expected $REQUIRED, received $NEW_VERSION." >&2
              exit 1
          fi

          # Recheck immediately before replacing the managed installation.
          if pgrep -x chrome >/dev/null 2>&1; then
              echo "Chrome started during preparation. Installation postponed."
              exit 0
          fi

          # Preserve the previous managed installation for rollback.
          if [ -d "$TARGET" ]; then
              mv "$TARGET" "$BACKUP"
          fi

          if ! mv "$STAGE/chrome-linux64" "$TARGET"; then
              if [ -d "$BACKUP" ]; then
                  mv "$BACKUP" "$TARGET"
              fi
              exit 1
          fi

          INSTALLED=$("$TARGET_BINARY" --version |
              grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1 || true)

          if [ "$INSTALLED" != "$REQUIRED" ]; then
              rm -rf "$TARGET"

              if [ -d "$BACKUP" ]; then
                  mv "$BACKUP" "$TARGET"
              fi

              echo "Chrome verification failed." >&2
              exit 1
          fi

          # Configure the command only after successful verification.
          ln -sfn "$TARGET_BINARY" "$LINK"

          # Use a local desktop entry override.
          mkdir -p "$DESKTOP_DIR"

          cat > "$DESKTOP_DIR/com.google.Chrome.desktop" <<EOF
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          EOF

          systemctl disable --now "$TIMER" >/dev/null 2>&1 || true

          echo "Chrome $INSTALLED installed and verified."

    # ============================================================
    # 10. CREATE SYSTEMD SERVICE FOR DEFERRED INSTALLATION
    # ============================================================

    - name: Create pending Chrome installation service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ chrome_service }}"
        mode: '0644'
        content: |
          [Unit]
          Description=Install Chrome after the browser closes

          [Service]
          Type=oneshot
          ExecStart={{ chrome_script }}
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - (chrome_running.rc | default(1)) == 0

    # ============================================================
    # 11. CREATE SYSTEMD TIMER
    # ============================================================

    - name: Create pending Chrome installation timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ chrome_timer }}"
        mode: '0644'
        content: |
          [Unit]
          Description=Retry pending Chrome installation

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit={{ chrome_service }}

          [Install]
          WantedBy=timers.target
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - (chrome_running.rc | default(1)) == 0

    - name: Enable pending installation timer
      ansible.builtin.systemd:
        name: "{{ chrome_timer }}"
        enabled: yes
        state: started
        daemon_reload: yes
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - (chrome_running.rc | default(1)) == 0

    # ============================================================
    # 12. INSTALL OR UPGRADE IMMEDIATELY IF CHROME IS CLOSED
    # ============================================================

    - name: Install or upgrade Chrome immediately
      ansible.builtin.command:
        cmd: "{{ chrome_script }}"
      register: chrome_install_result
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - (chrome_running.rc | default(1)) != 0

    # ============================================================
    # 13. REPAIR THE GOOGLE-CHROME COMMAND
    # ============================================================

    - name: Configure google-chrome symlink
      ansible.builtin.file:
        src: "{{ chrome_binary }}"
        dest: "{{ chrome_link }}"
        state: link
        force: yes
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and (chrome_running.rc | default(1)) != 0
        )

    # ============================================================
    # 14. CONFIGURE LINUX MINT DESKTOP LAUNCHER
    # ============================================================

    - name: Create desktop launcher directory
      ansible.builtin.file:
        path: "{{ chrome_desktop_dir }}"
        state: directory
        mode: '0755'
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and (chrome_running.rc | default(1)) != 0
        )

    - name: Configure managed Chrome desktop launcher
      ansible.builtin.copy:
        dest: "{{ chrome_desktop_file }}"
        mode: '0644'
        content: |
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and (chrome_running.rc | default(1)) != 0
        )

    # ============================================================
    # 15. VERIFY INSTALLED VERSION
    # ============================================================

    - name: Verify Chrome installation
      ansible.builtin.command:
        cmd: "{{ chrome_binary }} --version"
      register: chrome_final_version
      changed_when: false
      failed_when: false
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and (chrome_running.rc | default(1)) != 0
        )

    # ============================================================
    # 16. FINAL STATUS
    # ============================================================

    - name: Display final Chrome status
      ansible.builtin.debug:
        msg:
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"
          - "Bookmark files backed up: {{ chrome_bookmark_files.matched | default(0) }}"
          - "Bookmark backup root: {{ chrome_bookmark_backup_root }}/{{ inventory_hostname }}"
          - >-
            {{
              'Installation or upgrade deferred until Chrome closes.'
              if chrome_action in ['INSTALL', 'UPGRADE']
                 and (chrome_running.rc | default(1)) == 0
              else
              (
                chrome_final_version.stdout | default('Version verification pending')
                if chrome_action in ['INSTALL', 'UPGRADE', 'SKIP']
                else
                'A newer Chrome version was detected; no downgrade performed.'
              )
            }}
