
---
- name: Install or upgrade Google Chrome on Linux
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    chrome_version: "154.0.8037.57"

    # Must point to the actual Google Chrome Stable .deb package.
    chrome_deb_url: "http://172.17.9.58/chrome/linux/google-chrome-stable_154.0.8037.57-1_amd64.deb"

    chrome_deb_path: "/var/cache/google-chrome/google-chrome-stable.deb"
    chrome_backup_dir: "/var/backups/google-chrome-bookmarks"
    chrome_script: "/usr/local/sbin/google-chrome-install-upgrade.sh"
    chrome_deadline: "/var/lib/google-chrome-upgrade-deadline"
    chrome_service: "google-chrome-install-upgrade.service"
    chrome_timer: "google-chrome-install-upgrade.timer"

  tasks:
    - name: Validate supported operating system
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == "Debian"
          - ansible_facts.architecture == "x86_64"
        fail_msg: "This playbook supports Debian-family x86_64 Linux systems."

    - name: Check whether Google Chrome is installed
      ansible.builtin.shell: |
        if command -v google-chrome >/dev/null 2>&1; then
          google-chrome --version
        elif command -v google-chrome-stable >/dev/null 2>&1; then
          google-chrome-stable --version
        else
          exit 1
        fi
      args:
        executable: /bin/bash
      register: chrome_detect
      changed_when: false
      failed_when: false

    - name: Extract installed Chrome version
      ansible.builtin.set_fact:
        chrome_current_version: >-
          {{
            chrome_detect.stdout
            | regex_search('[0-9]+(\.[0-9]+){3}')
            | default('', true)
          }}

    - name: Determine installation or upgrade action
      ansible.builtin.set_fact:
        chrome_action: >-
          {{
            'INSTALL'
            if chrome_current_version == ''
            else (
              'UPGRADE'
              if chrome_current_version is version(chrome_version, '<')
              else (
                'SKIP'
                if chrome_current_version is version(chrome_version, '=')
                else 'NEWER'
              )
            )
          }}

    - name: Display detected Chrome status
      ansible.builtin.debug:
        msg:
          - "Detected version: {{ chrome_current_version | default('Not installed', true) }}"
          - "Target version: {{ chrome_version }}"
          - "Action: {{ chrome_action }}"

    - name: Check whether Chrome is running
      ansible.builtin.shell: |
        if pgrep -x chrome >/dev/null 2>&1 ||
           pgrep -x google-chrome >/dev/null 2>&1 ||
           pgrep -x google-chrome-stable >/dev/null 2>&1; then
          echo true
        else
          echo false
        fi
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Create package cache directory
      ansible.builtin.file:
        path: "{{ chrome_deb_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Download Chrome Stable package
      ansible.builtin.get_url:
        url: "{{ chrome_deb_url }}"
        dest: "{{ chrome_deb_path }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 300
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Validate package name
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - --field
          - "{{ chrome_deb_path }}"
          - Package
      register: chrome_package_name
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Validate package version
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - --field
          - "{{ chrome_deb_path }}"
          - Version
      register: chrome_package_version
      changed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Ensure package matches the requested Chrome release
      ansible.builtin.assert:
        that:
          - chrome_package_name.stdout | trim == 'google-chrome-stable'
          - >-
            chrome_package_version.stdout | trim
            is match('^154\.0\.8037\.57(-[0-9]+)?$')
        fail_msg: >-
          The downloaded DEB is not the expected Google Chrome Stable
          {{ chrome_version }} package.
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Find existing Chrome bookmarks
      ansible.builtin.find:
        paths:
          - /home
          - /root
        patterns:
          - Bookmarks
          - Bookmarks.bak
        recurse: true
        hidden: true
        file_type: file
      register: chrome_bookmarks
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Create bookmark backup directory
      ansible.builtin.file:
        path: "{{ chrome_backup_dir }}/{{ inventory_hostname }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_bookmarks.files | default([]) | length > 0

    - name: Back up existing bookmarks
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ chrome_backup_dir }}/{{ inventory_hostname }}/{{ item.path | regex_replace('^/', '') | regex_replace('/', '__') }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ chrome_bookmarks.files | default([]) }}"
      loop_control:
        label: "{{ item.path }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Install or upgrade Chrome when no Chrome process is running
      ansible.builtin.apt:
        deb: "{{ chrome_deb_path }}"
        state: present
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'false'

    - name: Create deferred installer when Chrome is running
      ansible.builtin.copy:
        dest: "{{ chrome_script }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -u

          DEB="{{ chrome_deb_path }}"
          TARGET="{{ chrome_version }}"
          DEADLINE="{{ chrome_deadline }}"
          TIMER="{{ chrome_timer }}"

          log() {
            logger -t google-chrome-install-upgrade "$*"
          }

          if [ -f "$DEADLINE" ] && [ "$(date +%s)" -ge "$(cat "$DEADLINE")" ]; then
            log "Deferred installation expired after 24 hours. Manual retry required."
            systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
            exit 1
          fi

          if pgrep -x chrome >/dev/null 2>&1 ||
             pgrep -x google-chrome >/dev/null 2>&1 ||
             pgrep -x google-chrome-stable >/dev/null 2>&1; then
            log "Chrome is still running; waiting for the next retry."
            exit 0
          fi

          if apt-get install -y "$DEB"; then
            CURRENT=$(google-chrome --version 2>/dev/null |
              grep -oE '[0-9]+(\.[0-9]+){3}' | head -n1 || true)

            if [ "$CURRENT" = "$TARGET" ]; then
              log "Successfully installed Chrome $CURRENT."
              rm -f "$DEADLINE"
              systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
              exit 0
            fi
          fi

          log "Installation failed or the installed version does not match $TARGET."
          exit 1
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'true'

    - name: Record 24-hour deferred installation deadline
      ansible.builtin.shell: |
        date -d '+24 hours' +%s > "{{ chrome_deadline }}"
        chmod 0600 "{{ chrome_deadline }}"
      args:
        executable: /bin/bash
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'true'

    - name: Create deferred installer service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ chrome_service }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Deferred Google Chrome installation or upgrade

          [Service]
          Type=oneshot
          ExecStart={{ chrome_script }}
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'true'

    - name: Create deferred installer timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ chrome_timer }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Retry Google Chrome installation or upgrade

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit={{ chrome_service }}

          [Install]
          WantedBy=timers.target
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'true'

    - name: Enable deferred installer timer
      ansible.builtin.systemd:
        name: "{{ chrome_timer }}"
        enabled: true
        state: started
        daemon_reload: true
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'true'

    - name: Verify Chrome version after immediate installation or upgrade
      ansible.builtin.command:
        argv:
          - google-chrome
          - --version
      register: chrome_final
      changed_when: false
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'false'

    - name: Assert installation or upgrade succeeded
      ansible.builtin.assert:
        that:
          - chrome_final.rc == 0
          - >-
            (chrome_final.stdout |
            regex_search('[0-9]+(\.[0-9]+){3}')) == chrome_version
        fail_msg: >-
          Chrome installation/upgrade verification failed:
          {{ chrome_final.stdout | default('No output') }}
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.stdout | trim == 'false'

    - name: Display final result
      ansible.builtin.debug:
        msg:
          - "Detected action: {{ chrome_action }}"
          - "Target version: {{ chrome_version }}"
          - >-
            Result:
            {{
              'Installation/upgrade completed and verified.'
              if chrome_action in ['INSTALL', 'UPGRADE']
                 and chrome_running.stdout | default('false') | trim == 'false'
              else (
                'Deferred until Chrome closes.'
                if chrome_action in ['INSTALL', 'UPGRADE']
                   and chrome_running.stdout | default('false') | trim == 'true'
                else (
                  'Already at target version; skipped.'
                  if chrome_action == 'SKIP'
                  else 'Installed version is newer than target; skipped.'
                )
              )
            }}
          - "Bookmark backup location: {{ chrome_backup_dir }}/{{ inventory_hostname }}"
          - "Verification command: google-chrome --version"
