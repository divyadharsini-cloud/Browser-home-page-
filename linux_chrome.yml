
---
- name: Deploy Chrome 154.0.8037.57 on Linux clients
  hosts: ansibletesting
  become: true
  gather_facts: true

  vars:
    required_chrome_version: "154.0.8037.57"

    # Internal mirror: Chrome for Testing ZIP
    chrome_zip_url: "http://172.17.9.58/chrome/linux/154.0.8037.57/chrome-linux64.zip"
    chrome_zip_path: "/var/cache/chrome-linux64.zip"

    # Client installation paths
    chrome_install_dir: "/opt/chrome-for-testing/154.0.8037.57"
    chrome_binary: "/opt/chrome-for-testing/154.0.8037.57/chrome-linux64/chrome"
    chrome_link: "/usr/bin/google-chrome"

    # Bookmark backup
    bookmark_backup_root: "/var/backups/chrome-bookmarks"

    # Deferred installation
    pending_script: "/usr/local/sbin/chrome-testing-pending.sh"
    pending_service: "chrome-testing-pending.service"
    pending_timer: "chrome-testing-pending.timer"

  tasks:

    # 1. Check architecture
    - name: Verify Linux architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture == "x86_64"
        fail_msg: "This playbook requires an x86_64 Linux client."

    # 2. Detect the requested Chrome for Testing version
    - name: Detect installed Chrome for Testing version
      ansible.builtin.shell: |
        if [ -x "{{ chrome_binary }}" ]; then
          "{{ chrome_binary }}" --version 2>/dev/null |
            grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
        else
          echo "NOT_INSTALLED"
        fi
      args:
        executable: /bin/bash
      register: chrome_version_check
      changed_when: false

    # 3. Decide whether to install, upgrade, or skip
    - name: Determine Chrome deployment action
      ansible.builtin.set_fact:
        chrome_action: >-
          {{
            'INSTALL'
            if (chrome_version_check.stdout | trim) == 'NOT_INSTALLED'
            else
            (
              'UPGRADE'
              if (chrome_version_check.stdout | trim)
                 is version(required_chrome_version, '<')
              else 'SKIP'
            )
          }}

    - name: Display Chrome deployment decision
      ansible.builtin.debug:
        msg:
          - "Detected version: {{ chrome_version_check.stdout | trim }}"
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"

    # 4. Back up bookmarks before installation or upgrade
    - name: Create bookmark backup directory
      ansible.builtin.file:
        path: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Find existing Chrome bookmarks
      ansible.builtin.find:
        paths:
          - /home
          - /root
        patterns: Bookmarks
        file_type: file
        recurse: true
        hidden: true
        excludes:
          - thinclient_drives
      register: bookmark_files
      failed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Back up Chrome bookmarks
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}/{{ item.path | regex_replace('^/', '') | replace('/', '__') }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ bookmark_files.files | default([]) }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Display bookmark backup summary
      ansible.builtin.debug:
        msg:
          - "Bookmark files found: {{ bookmark_files.matched | default(0) }}"
          - "Backup directory: {{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 5. Install dependencies ON THE CLIENT
    # Supports older package names and Ubuntu 24.04-style t64 names.
    - name: Install Chrome runtime dependencies on client
      ansible.builtin.shell: |
        set -euo pipefail
        export DEBIAN_FRONTEND=noninteractive

        apt-get update

        choose_pkg() {
          for pkg in "$@"; do
            if apt-cache show "$pkg" >/dev/null 2>&1; then
              echo "$pkg"
              return 0
            fi
          done
          echo "No available package found among: $*" >&2
          return 1
        }

        pkgs=(
          unzip
          libnss3
          libx11-6
          libx11-xcb1
          libxcb1
          libxcomposite1
          libxdamage1
          libxext6
          libxfixes3
          libxrandr2
          libgbm1
          libpango-1.0-0
          libcairo2
          libxshmfence1
          libdrm2
        )

        pkgs+=("$(choose_pkg libatk1.0-0 libatk1.0-0t64)")
        pkgs+=("$(choose_pkg libatk-bridge2.0-0 libatk-bridge2.0-0t64)")
        pkgs+=("$(choose_pkg libatspi2.0-0 libatspi2.0-0t64)")
        pkgs+=("$(choose_pkg libasound2 libasound2t64)")
        pkgs+=("$(choose_pkg libgtk-3-0 libgtk-3-0t64)")

        apt-get install -y "${pkgs[@]}"
      args:
        executable: /bin/bash
      register: dependency_install
      changed_when: "'0 newly installed' not in dependency_install.stdout"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 6. Download the exact ZIP from the mirror
    - name: Create package cache directory
      ansible.builtin.file:
        path: /var/cache
        state: directory
        mode: "0755"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Download Chrome ZIP from internal mirror
      ansible.builtin.get_url:
        url: "{{ chrome_zip_url }}"
        dest: "{{ chrome_zip_path }}"
        mode: "0644"
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 7. Check whether Chrome is running
    - name: Check Chrome processes
      ansible.builtin.shell: |
        pgrep -x chrome >/dev/null 2>&1
      args:
        executable: /bin/bash
      register: chrome_running
      changed_when: false
      failed_when: false
      when: chrome_action in ['INSTALL', 'UPGRADE']

    - name: Display browser process status
      ansible.builtin.debug:
        msg: >-
          {{
            'Chrome is running. Deployment will wait until it closes.'
            if chrome_running.rc == 0
            else 'Chrome is not running. Deployment can proceed.'
          }}
      when: chrome_action in ['INSTALL', 'UPGRADE']

    # 8. Install immediately if Chrome is closed
    - name: Create Chrome installation directory
      ansible.builtin.file:
        path: "{{ chrome_install_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    - name: Extract Chrome ZIP on client
      ansible.builtin.unarchive:
        src: "{{ chrome_zip_path }}"
        dest: "{{ chrome_install_dir }}"
        remote_src: true
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    - name: Verify exact Chrome version
      ansible.builtin.command:
        argv:
          - "{{ chrome_binary }}"
          - --version
      register: chrome_extracted_version
      changed_when: false
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    - name: Assert exact Chrome version
      ansible.builtin.assert:
        that:
          - >-
            (chrome_extracted_version.stdout |
            regex_search('[0-9]+(\.[0-9]+){3}')) ==
            required_chrome_version
        fail_msg: >-
          Expected {{ required_chrome_version }} but got
          {{ chrome_extracted_version.stdout }}.
        success_msg: "Exact Chrome version verified."
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc != 0

    # 9. Create the launcher only after successful verification
    - name: Configure Google Chrome command
      ansible.builtin.file:
        src: "{{ chrome_binary }}"
        dest: "{{ chrome_link }}"
        state: link
        force: true
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and chrome_running.rc != 0
        )

    - name: Create Chrome Applications menu entry
      ansible.builtin.copy:
        dest: /usr/share/applications/google-chrome-stable.desktop
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupNotify=true

    - name: Refresh desktop application database
      ansible.builtin.command:
        cmd: update-desktop-database /usr/share/applications
      changed_when: false
      failed_when: false

    # 10. Defer deployment if Chrome is running
    - name: Create deferred installation script
      ansible.builtin.copy:
        dest: "{{ pending_script }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail

          REQUIRED="{{ required_chrome_version }}"
          ZIP="{{ chrome_zip_path }}"
          INSTALL_DIR="{{ chrome_install_dir }}"
          BIN="{{ chrome_binary }}"
          TIMER="{{ pending_timer }}"

          # Never force-close Chrome.
          if pgrep -x chrome >/dev/null 2>&1; then
            echo "Chrome is still running; retry later."
            exit 0
          fi

          mkdir -p "$INSTALL_DIR"
          unzip -oq "$ZIP" -d "$INSTALL_DIR"

          VERSION=$(
            "$BIN" --version |
            grep -oE '[0-9]+(\.[0-9]+){3}' |
            head -n 1
          )

          if [ "$VERSION" != "$REQUIRED" ]; then
            echo "Expected $REQUIRED, got $VERSION" >&2
            exit 1
          fi

          ln -sfn "$BIN" /usr/bin/google-chrome

          systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
          echo "Chrome for Testing $VERSION installed successfully."

      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Create deferred installation service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_service }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Deploy Chrome for Testing after browser closure

          [Service]
          Type=oneshot
          ExecStart={{ pending_script }}
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Create deferred installation timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_timer }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Retry Chrome deployment after browser closure

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit={{ pending_service }}

          [Install]
          WantedBy=timers.target
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    - name: Enable deferred installation timer
      ansible.builtin.systemd:
        name: "{{ pending_timer }}"
        daemon_reload: true
        enabled: true
        state: started
      when:
        - chrome_action in ['INSTALL', 'UPGRADE']
        - chrome_running.rc == 0

    # 11. Verify immediate deployment
    - name: Verify deployed Chrome version
      ansible.builtin.command:
        argv:
          - "{{ chrome_binary }}"
          - --version
      register: chrome_final_version
      changed_when: false
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action in ['INSTALL', 'UPGRADE']
          and chrome_running.rc != 0
        )

    # 12. Final status
    - name: Display final deployment status
      ansible.builtin.debug:
        msg:
          - "Required version: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"
          - "Bookmarks found: {{ bookmark_files.matched | default(0) }}"
          - >-
            {{
              'Deployment scheduled; waiting for Chrome to close.'
              if chrome_action in ['INSTALL', 'UPGRADE']
                 and chrome_running.rc == 0
              else
              (
                'Verified: ' ~ chrome_final_version.stdout
                if chrome_final_version is defined
                else 'No deployment performed.'
              )
            }}
