---
- name: Configure OpenSSH Default Shell
  hosts: DTHNPH1FU010052
  gather_facts: no

  tasks:

    - name: Create PowerShell configuration script
      ansible.builtin.copy:
        content: |
          $ErrorActionPreference = "Stop"

          New-ItemProperty `
            -Path "HKLM:\SOFTWARE\OpenSSH" `
            -Name "DefaultShell" `
            -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -PropertyType String `
            -Force

          Restart-Service sshd

          $shell = (Get-ItemProperty `
            -Path "HKLM:\SOFTWARE\OpenSSH" `
            -Name "DefaultShell").DefaultShell

          Write-Output "DefaultShell: $shell"
        dest: C:\Windows\Temp\configure-openssh.ps1

    - name: Execute PowerShell configuration script
      ansible.builtin.command: powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:\Windows\Temp\configure-openssh.ps1
      register: openssh_result

    - name: Display result
      ansible.builtin.debug:
        var: openssh_result.stdout

    - name: Remove temporary script
      ansible.builtin.file:
        path: C:\Windows\Temp\configure-openssh.ps1
        state: absent
