---
- name: Bootstrap OpenSSH PowerShell Default Shell
  hosts: DMDUCHGFMRD0017, DMDULB1FFED0002, DMDUFHGFREMRD06, DMDUIP1FOTQA017, DMDULB1FFED0006, DMDULB2FBIO0073, DMDULB2FBIOSTNB, DMDUPH3FDOC0056, DMDULB2FDTP0043, DMDUPH1FCAL0100, DMDULB3FAIT0101, DMDULB2FBIO0115, DMDUPH1FINV0022, DMDUPH1FINV0046, DMDUPH1FCAL0097, DMDUPH1FPHY0026, DMDUPH1FMRD0030, DMDUPH2FINV0046, DMDUPH3FDOC0014, DMDUPH2FCHA0039, DMDUPH4FLLP0006, DMDUPH2FMRD2004, DMDULBGFADM0010, DMDUPH4FEYE0046, DMDUPH4FLLP0067, DMDUCC14TMMOPT1, DMDUPH2FMRD0048, DMDUPHGFMEDI00, DMDUPH4FVCM0037, LMDUPH1FINS0005
  gather_facts: no

  vars:
    ansible_connection: ssh
    ansible_port: 22
    ansible_user: mduroot
    ansible_shell_type: cmd
    ansible_shell_executable: cmd.exe

  tasks:

    - name: Configure PowerShell as OpenSSH DefaultShell
      ansible.builtin.raw: >-
        reg.exe ADD "HKLM\SOFTWARE\OpenSSH"
        /v DefaultShell
        /t REG_SZ
        /d "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe"
        /f

      register: registry_result

    - name: Display registry result
      ansible.builtin.debug:
        var: registry_result.stdout

    - name: Restart OpenSSH SSHD service
      ansible.builtin.raw: >-
        powershell.exe -NoProfile -NonInteractive
        -Command "Restart-Service sshd"

      register: sshd_restart
      ignore_errors: yes

    - name: Wait for SSHD to restart
      ansible.builtin.pause:
        seconds: 5


- name: Verify OpenSSH PowerShell Default Shell
  hosts: windows
  gather_facts: no

  vars:
    ansible_connection: ssh
    ansible_port: 22
    ansible_user: mduroot
    ansible_shell_type: powershell
    ansible_shell_executable: powershell.exe

  tasks:

    - name: Verify PowerShell is the OpenSSH default shell
      ansible.builtin.raw: |
        (Get-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShell").DefaultShell
      register: default_shell

    - name: Display configured DefaultShell
      ansible.builtin.debug:
        msg: "OpenSSH DefaultShell = {{ default_shell.stdout | trim }}"
