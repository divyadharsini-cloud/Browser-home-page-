---
- name: Configure OpenSSH Default Shell
  hosts: DTHNPH1FU010052
  gather_facts: no

  tasks:

    - name: Configure OpenSSH DefaultShell
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\OpenSSH
        name: DefaultShell
        data: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        type: string

    - name: Restart OpenSSH SSHD service
      ansible.windows.win_service:
        name: sshd
        state: restarted

    - name: Verify OpenSSH DefaultShell
      ansible.windows.win_shell: |
        (Get-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShell").DefaultShell
      register: openssh_shell

    - name: Display configured shell
      ansible.builtin.debug:
        msg: "OpenSSH DefaultShell: {{ openssh_shell.stdout | trim }}"
