---
- name: Configure OpenSSH Default Shell
  hosts: DTHNPH1FU010052
  gather_facts: no

  tasks:

    - name: Configure PowerShell as OpenSSH DefaultShell
      ansible.builtin.raw: |
        New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShell" -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force

    - name: Restart OpenSSH SSHD service
      ansible.builtin.raw: |
        Restart-Service sshd

    - name: Verify OpenSSH DefaultShell
      ansible.builtin.raw: |
        (Get-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name "DefaultShell").DefaultShell
      register: default_shell

    - name: Display configured DefaultShell
      ansible.builtin.debug:
        msg: "{{ default_shell.stdout }}"
