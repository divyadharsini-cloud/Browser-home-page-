---
- name: Deploy standard Google Chrome 154.0.8037.57 on Linux client
  hosts: TCBEPHGF2URR008, TCBEPHGFU3R0018, TCBEPHGF2URR006, DCBEPHGFU3D0052, DCBEPHGFU2E0385, TCBEPHGF3UDR121, TCBEPHGFU1R0004, TCBEPHGFU1R0305, TCBEPHGFU3R0019
  become: true
  gather_facts: true

  vars:
    required_chrome_version: "154.0.8037.57"
    required_package_version: "154.0.8037.57-1"

    chrome_package_url: "http://172.20.1.113/chrome/google-chrome-stable_154.0.8037.57-1_amd64.deb"
    chrome_package_path: "/var/cache/google-chrome-stable_154.0.8037.57-1_amd64.deb"

    chrome_stable_launcher: "/usr/bin/google-chrome-stable"
    chrome_command: "/usr/bin/google-chrome"

    bookmark_backup_root: "/var/backups/chrome-bookmarks"

    pending_script: "/usr/local/sbin/chrome-stable-pending.sh"
    pending_service: "chrome-stable-pending.service"
    pending_timer: "chrome-stable-pending.timer"
    chrome_deadline_file: "/var/lib/chrome-stable-upgrade-start"

  tasks:

    # 1. Validate the client
    - name: Verify client architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.architecture == "x86_64"
          - ansible_facts.os_family == "Debian"
        fail_msg: "This playbook requires a Debian-based x86_64 Linux client."

    # 2. Detect the installed standard Chrome version
    - name: Detect installed standard Chrome version
      ansible.builtin.shell: |
        if command -v google-chrome-stable >/dev/null 2>&1; then
          google-chrome-stable --version 2>/dev/null |
            grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
        else
          echo NOT_INSTALLED
        fi
      args:
        executable: /bin/bash
      register: chrome_version_check
      changed_when: false
      failed_when: false

    - name: Determine deployment action
      ansible.builtin.set_fact:
        chrome_action: >-
          {{
            'INSTALL'
            if (chrome_version_check.stdout | trim) == 'NOT_INSTALLED'
            else
            (
              'SKIP'
              if (chrome_version_check.stdout | trim) == required_chrome_version
              else 'REPLACE'
            )
          }}

    - name: Display detected version and action
      ansible.builtin.debug:
        msg:
          - "Installed standard Chrome: {{ chrome_version_check.stdout | trim }}"
          - "Required Chrome: {{ required_chrome_version }}"
          - "Action: {{ chrome_action }}"

    # 3. Back up bookmarks before replacing Chrome
    - name: Create bookmark backup directory
      ansible.builtin.file:
        path: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: chrome_action != 'SKIP'

    - name: Find Chrome bookmarks
      ansible.builtin.shell: |
        find /home /root \
          -path '*/thinclient_drives' -prune -o \
          -type f -name Bookmarks -print 2>/dev/null || true
      args:
        executable: /bin/bash
      register: bookmark_search
      changed_when: false
      when: chrome_action != 'SKIP'

    - name: Back up existing bookmarks
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ bookmark_backup_root }}/{{ inventory_hostname }}/{{ ansible_date_time.iso8601_basic_short }}/{{ item | regex_replace('^/', '') | replace('/', '__') }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      loop: "{{ bookmark_search.stdout_lines | default([]) }}"
      when: chrome_action != 'SKIP'

    - name: Display bookmark backup count
      ansible.builtin.debug:
        msg: "Bookmark files backed up: {{ bookmark_search.stdout_lines | default([]) | length }}"
      when: chrome_action != 'SKIP'

    # 4. Download Chrome from the internal mirror
    - name: Download Chrome package from internal mirror
      ansible.builtin.get_url:
        url: "{{ chrome_package_url }}"
        dest: "{{ chrome_package_path }}"
        mode: "0644"
        timeout: 180
      when: chrome_action != 'SKIP'

    # 5. Validate package version and architecture
    - name: Read downloaded package version
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - -f
          - "{{ chrome_package_path }}"
          - Version
      register: chrome_deb_version
      changed_when: false
      when: chrome_action != 'SKIP'

    - name: Read downloaded package architecture
      ansible.builtin.command:
        argv:
          - dpkg-deb
          - -f
          - "{{ chrome_package_path }}"
          - Architecture
      register: chrome_deb_architecture
      changed_when: false
      when: chrome_action != 'SKIP'

    - name: Validate exact Chrome package
      ansible.builtin.assert:
        that:
          - (chrome_deb_version.stdout | trim) == required_package_version
          - (chrome_deb_architecture.stdout | trim) == "amd64"
        fail_msg: >-
          Package validation failed.
          Version={{ chrome_deb_version.stdout | default('unknown') }},
          Architecture={{ chrome_deb_architecture.stdout | default('unknown') }}.
        success_msg: "Validated standard Chrome package {{ required_package_version }} (amd64)."
      when: chrome_action != 'SKIP'

    # 6. Check active Chrome sessions
    - name: Check whether Chrome is running
      ansible.builtin.command:
        argv:
          - pgrep
          - -x
          - chrome
      register: chrome_running
      changed_when: false
      failed_when: false

    # 7. Install or replace Chrome only when it is closed
    - name: Install exact standard Chrome package
      ansible.builtin.apt:
        deb: "{{ chrome_package_path }}"
        state: present
        update_cache: true
        allow_downgrade: true
      when:
        - chrome_action != 'SKIP'
        - chrome_running.rc != 0

    - name: Verify installed standard Chrome version
      ansible.builtin.command:
        argv:
          - "{{ chrome_stable_launcher }}"
          - --version
      register: chrome_final_version
      changed_when: false
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action != 'SKIP'
          and chrome_running.rc != 0
        )

    - name: Assert required Chrome version
      ansible.builtin.assert:
        that:
          - >-
            (chrome_final_version.stdout |
            regex_search('[0-9]+(\.[0-9]+){3}')) ==
            required_chrome_version
        fail_msg: "Expected {{ required_chrome_version }}; found {{ chrome_final_version.stdout }}."
        success_msg: "Verified {{ chrome_final_version.stdout }}."
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action != 'SKIP'
          and chrome_running.rc != 0
        )

    # 8. Restore Chrome command and desktop launcher
    - name: Point google-chrome command to standard Chrome
      ansible.builtin.file:
        src: "{{ chrome_stable_launcher }}"
        dest: "{{ chrome_command }}"
        state: link
        force: true
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action != 'SKIP'
          and chrome_running.rc != 0
        )

    - name: Correct Chrome desktop launcher
      ansible.builtin.copy:
        dest: /usr/share/applications/google-chrome-stable.desktop
        owner: root
        group: root
        mode: "0644"
        content: |
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome-stable %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupNotify=true
      when: >-
        chrome_action == 'SKIP'
        or
        (
          chrome_action != 'SKIP'
          and chrome_running.rc != 0
        )

    # 9. If Chrome is running, record the 24-hour deadline
    - name: Record deferred installation start time
      ansible.builtin.shell: |
        install -d -m 0755 /var/lib
        date +%s > "{{ chrome_deadline_file }}"
      args:
        executable: /bin/bash
      changed_when: true
      when:
        - chrome_action != 'SKIP'
        - chrome_running.rc == 0

    # 10. Create deferred installation script with 24-hour expiry
    - name: Create deferred Chrome installation script
      ansible.builtin.copy:
        dest: "{{ pending_script }}"
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          set -euo pipefail

          DEB="{{ chrome_package_path }}"
          REQUIRED="{{ required_chrome_version }}"
          PACKAGE_VERSION="{{ required_package_version }}"
          TIMER="{{ pending_timer }}"
          DEADLINE="{{ chrome_deadline_file }}"

          # Stop retrying after 24 hours.
          if [ -f "$DEADLINE" ]; then
            START=$(cat "$DEADLINE")
            NOW=$(date +%s)

            if [[ "$START" =~ ^[0-9]+$ ]] &&
               [ $((NOW - START)) -ge 86400 ]; then
              echo "Deferred installation expired after 24 hours; Chrome was not changed."
              systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
              rm -f "$DEADLINE"
              exit 0
            fi
          else
            echo "Deadline file is missing; refusing an unlimited retry loop." >&2
            systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
            exit 1
          fi

          # Never terminate an active Chrome session.
          if pgrep -x chrome >/dev/null 2>&1; then
            echo "Chrome is still running; will retry."
            exit 0
          fi

          # Validate the package before installation.
          ACTUAL_PACKAGE=$(dpkg-deb -f "$DEB" Version)

          if [ "$ACTUAL_PACKAGE" != "$PACKAGE_VERSION" ]; then
            echo "Unexpected package version: $ACTUAL_PACKAGE" >&2
            exit 1
          fi

          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y "$DEB"

          VERSION=$(
            /usr/bin/google-chrome-stable --version |
            grep -oE '[0-9]+(\.[0-9]+){3}' | head -n 1
          )

          if [ "$VERSION" != "$REQUIRED" ]; then
            echo "Expected $REQUIRED; found $VERSION" >&2
            exit 1
          fi

          ln -sfn /usr/bin/google-chrome-stable /usr/bin/google-chrome

          cat > /usr/share/applications/google-chrome-stable.desktop <<'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Name=Google Chrome
          Comment=Web Browser
          Exec=/usr/bin/google-chrome-stable %U
          Icon=google-chrome
          Terminal=false
          Type=Application
          Categories=Network;WebBrowser;
          StartupNotify=true
          DESKTOP

          systemctl disable --now "$TIMER" >/dev/null 2>&1 || true
          rm -f "$DEADLINE"

          echo "Installed standard Chrome $VERSION"

      when:
        - chrome_action != 'SKIP'
        - chrome_running.rc == 0

    # 11. Create deferred installation service
    - name: Create deferred Chrome service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_service }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Install standard Chrome after browser closure

          [Service]
          Type=oneshot
          ExecStart={{ pending_script }}
      when:
        - chrome_action != 'SKIP'
        - chrome_running.rc == 0

    # 12. Create timer to retry every minute
    - name: Create deferred Chrome timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ pending_timer }}"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Retry standard Chrome installation

          [Timer]
          OnBootSec=1min
          OnUnitActiveSec=1min
          Unit={{ pending_service }}

          [Install]
          WantedBy=timers.target
      when:
        - chrome_action != 'SKIP'
        - chrome_running.rc == 0

    - name: Enable deferred installation timer
      ansible.builtin.systemd:
        name: "{{ pending_timer }}"
        daemon_reload: true
        enabled: true
        state: started
      when:
        - chrome_action != 'SKIP'
        - chrome_running.rc == 0

    # 13. Report deployment status
    - name: Display final deployment status
      ansible.builtin.debug:
        msg: >-
          {{
            'Chrome is running. Installation will retry every minute for up to 24 hours.'
            if chrome_action != 'SKIP' and chrome_running.rc == 0
            else
            'Verified standard Chrome: ' ~ chrome_final_version.stdout
          }}
