---
- name: Uninstall Firefox from Windows
  hosts: DMDULB1FTR00030
  gather_facts: false

  tasks:

    - name: Stop Firefox if running
      ansible.windows.win_powershell:
        script: |
          $firefox = Get-Process -Name "firefox" -ErrorAction SilentlyContinue

          if ($firefox) {
              $firefox | Stop-Process -Force
              Write-Output "Firefox process stopped."
          }
          else {
              Write-Output "Firefox is not running."
          }

    - name: Check Firefox installation
      ansible.windows.win_powershell:
        script: |
          $paths = @(
              "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*",
              "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )

          $firefox = Get-ItemProperty $paths -ErrorAction SilentlyContinue |
              Where-Object {
                  $_.DisplayName -like "*Mozilla Firefox*"
              } |
              Select-Object -First 1

          if ($firefox) {
              Write-Output "Firefox found: $($firefox.DisplayName)"
              Write-Output "Uninstall command: $($firefox.UninstallString)"
          }
          else {
              Write-Output "Firefox is not installed."
          }
