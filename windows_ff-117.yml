
---
- name: Uninstall Firefox from Windows
  hosts: DMDULB1FTR00030
  gather_facts: false

  tasks:

    - name: Uninstall Firefox
      ansible.windows.win_command: >-
        "C:\Program Files\Mozilla Firefox\uninstall\helper.exe" /S
      failed_when: false

    - name: Uninstall Firefox 32-bit
      ansible.windows.win_command: >-
        "C:\Program Files (x86)\Mozilla Firefox\uninstall\helper.exe" /S
      failed_when: false
