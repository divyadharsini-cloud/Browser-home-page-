
---
- name: Configure Chrome Homepage on Windows
  hosts: DMDUCHGFMRD0017, DMDUPH3FDOC0056, DMDUPH1FINV0022, DMDUPH1FINV0046, DMDUPH1FCAL0097, DMDUPH1FPHY0026, DMDUPH1FMRD0030, DMDUPH2FINV0046, DMDUPH2FCHA0039, DMDUPH4FLLP0006, DMDUPH2FMRD2004, DMDUPH4FEYE0046, DMDUPH4FLLP0067, DMDUCC14TMMOPT1, DMDUPH2FMRD0048, DMDUPHGFMEDI005, DMDUPH4FVCM0037, DMDUPHGFU1FUN68, DMDUPHGFPRO0051, DMDUPHGFSTR0121, DMDUPHGFNEU0103, DMDUPHUGSTO0002, DMDUPHUGSTR0114, DMDUPHGFNEU0105, DMDUPHGFLLP0013, DMDUPH4FLLP040, DMDUPH4FLLP041, DMDUPH4FLLP004, DMDUPH3FAVD0083, DMDUPH4LLP007, DMDUPHGFMED0002, DMDUPHGFOPT035, DMDUPHGFOPT030, DMDUPHGFQUA0008
  gather_facts: false

  vars:
    homepage_url: "https://eyenotesweb.aravind.org/"

  tasks:

    - name: Configure Chrome homepage policies
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
        state: present
      loop:
        - name: HomepageLocation
          data: "{{ homepage_url }}"
          type: string

        - name: HomepageIsNewTabPage
          data: 0
          type: dword

        - name: ShowHomeButton
          data: 1
          type: dword

        - name: RestoreOnStartup
          data: 4
          type: dword

    - name: Configure Chrome startup URL
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome\RestoreOnStartupURLs
        name: "1"
        data: "{{ homepage_url }}"
        type: string
        state: present

    - name: Verify Chrome homepage policy
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome
        name: HomepageLocation
      register: chrome_homepage

    - name: Report Chrome homepage status
      ansible.builtin.debug:
        msg: "Chrome homepage configured as: {{ chrome_homepage.value | default('Not found') }}"
