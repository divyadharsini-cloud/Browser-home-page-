
---
- name: Enforce Chrome Policies on Windows
  hosts: DMDUVC30USI0002, DMDUVC30USI0001
  become: yes
  become_method: runas
  gather_facts: no

  tasks:

    - name: Configure Chrome Enterprise policies
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
        state: present
      loop:
        - name: HomepageLocation
          data: "https://eyenotesweb.aravind.org/"
          type: string

        - name: HomepageIsNewTabPage
          data: 0
          type: dword

        - name: ShowHomeButton
          data: 1
          type: dword

        - name: RestoreOnStartup
          data: 4
          type: dword

        - name: PasswordManagerEnabled
          data: 0
          type: dword

    - name: Configure Chrome startup URL
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome\RestoreOnStartupURLs
        name: "1"
        data: "https://eyenotesweb.aravind.org/"
        type: string
        state: present

    - name: Configure cache clearing on exit
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome
        name: ClearBrowsingDataOnExitList
        data:
          - cached_images_and_files
        type: multistring
        state: present

    - name: Verify Chrome homepage policy
      ansible.windows.win_reg_stat:
        path: HKLM:\SOFTWARE\Policies\Google\Chrome
        name: HomepageLocation
      register: homepage_policy

    - name: Report deployment status
      ansible.builtin.debug:
        msg: >-
          Chrome homepage policy value:
          {{ homepage_policy.value | default('Not found') }}
