---
- name: Check Google Chrome Version on Windows
  hosts: DPDYFH1FWAR0796
  gather_facts: false

  tasks:

    - name: Check Chrome installation and version
      ansible.windows.win_powershell:
        script: |
          $chromePaths = @(
              "C:\Program Files\Google\Chrome\Application\chrome.exe",
              "C:\Program Files (x86)\Google\Chrome\Application\chrome.exe"
          )

          $chrome = $chromePaths |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1

          if ($chrome) {
              $version = (Get-Item $chrome).VersionInfo.ProductVersion

              [PSCustomObject]@{
                  Installed = $true
                  Path      = $chrome
                  Version   = $version
              }
          }
          else {
              [PSCustomObject]@{
                  Installed = $false
                  Path      = ""
                  Version   = ""
              }
          }
      register: chrome_check
      changed_when: false

    - name: Display Chrome status
      ansible.builtin.debug:
        msg:
          - "Chrome Installed : {{ chrome_check.output[0].Installed }}"
          - "Chrome Path      : {{ chrome_check.output[0].Path }}"
          - "Chrome Version   : {{ chrome_check.output[0].Version }}"
